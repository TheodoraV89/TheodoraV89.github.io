---
layout: default
---

<div class="post-content">
  <h1>{{ page.title }}</h1>

  {% if site.hide_post_date != true %}
    {% include post-date.html %}
  {% endif %}

  {% if page.image %}
    <div class="featured-image">
      <img src="{{ site.github.url }}/assets/img/{{ page.image }}">
    </div>
  {% endif %}

  <article>
    {{ content }}
  </article>

  <div class="post-pagination">
    {% if page.previous.url %}
      <a class="pagination-item prev" href="{{ page.previous.url }}">← Older</a>
    {% endif %}
  
    {% if page.next.url %}
      <a class="pagination-item next" href="{{ page.next.url }}">Newer →</a>
    {% endif %}
  </div>

  <div class="back-home">
    <a href="{{ site.baseurl }}/" class="btn-back">← Back to Projects</a>
  </div>
</div>
